---
- name: Prepare LVM data storage before installing Docker
  ansible.builtin.import_role:
    name: lvm

- name: Require the configured Compose directory to be on the app volume
  ansible.builtin.assert:
    that:
      - docker_base_dir == '/opt/docker'
    fail_msg: Adapt the storage layout before using a different docker_base_dir.

- name: Vorausgesetzte Pakete installieren
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true

- name: Verzeichnis für Docker-Keyring anlegen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG-Key hinterlegen
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker APT-Repository hinzufügen
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Alte Docker-Repository-Datei nach Umstellung entfernen
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Docker Engine, CLI und Compose-Plugin installieren
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker-Dienst aktivieren und starten
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ansible-User zur docker-Gruppe hinzufügen
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: docker_add_user_to_group | default(true)

- name: Basisverzeichnis für alle Compose-Apps anlegen
  ansible.builtin.file:
    path: "{{ docker_base_dir }}"
    state: directory
    mode: "0755"
