---
docker_apps:

  # USB-Passthrough zuerst einrichten: docs/frigate-coral.md
  # - name: frigate
  #   compose_template: frigate/docker-compose.yml.j2
  #   sensitive_config: true
  #   config_files:
  #     - src: frigate/config/config.yml.j2
  #       dest: config/config.yml
  #       mode: "0600"

  # --- Traefik: Ingress auf 80/443; Frigate separat auf 8971 ---
  - name: traefik
    compose_template: traefik/docker-compose.yml.j2
    env:
      TRAEFIK_DASHBOARD_AUTH: "{{ SECRET_TRAEFIK_DASHBOARD_AUTH }}"
      IONOS_API_KEY: "{{ SECRET_IONOS_API_KEY }}"
    config_files:
      - src: traefik/config/traefik.yml.j2
        dest: config/traefik.yml
      # Statische Route für Home Assistant, das wegen mDNS/SSDP im
      # host-Netzwerk läuft und daher nicht per Docker-Provider gefunden wird.
      - src: traefik/config/dynamic/homeassistant.yml.j2
        dest: config/dynamic/homeassistant.yml

  # --- Dockhand: Docker- und Compose-Management ---
  - name: dockhand
    compose_template: dockhand/docker-compose.yml.j2

  # --- Homeassistant ---
  - name: homeassistant
    compose_template: homeassistant/docker-compose.yml.j2
    sensitive_config: true
    env:
      HOMEASSISTANT_RECORDER_DB_URL: "{{ homeassistant_recorder_db_url }}"
    # Inhalte werden ausschließlich im separaten Home-Assistant-Repo verwaltet.
    directories:
      - {path: config, owner: '1000', group: '1000'}

  # --- VS Code im Browser für Home Assistant ---
  - name: code-server
    compose_template: code-server/docker-compose.yml.j2
    sensitive_config: true
    directories:
      - {path: config, owner: '1000', group: '1000'}
      - {path: data, owner: '1000', group: '1000'}
    config_files:
      - src: code-server/config.yaml.j2
        dest: config/config.yaml
        directory_mode: '0750'
        owner: '1000'
        group: '1000'
        mode: '0400'

  # --- Node-RED ---
  - name: nodered
    compose_template: nodered/docker-compose.yml.j2
    directories:
      - {path: data, owner: '1000', group: '1000'}

  # --- N8N ---
  - name: n8n
    compose_template: n8n/docker-compose.yml.j2
    directories:
      - {path: home, owner: '1000', group: '1000'}
      - {path: files, owner: '1000', group: '1000'}
