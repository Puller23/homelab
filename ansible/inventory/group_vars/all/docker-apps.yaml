  # --- Traefik: Ingress auf 80/443; Frigate separat auf 8971 ---
  - name: traefik
    compose_template: traefik/docker-compose.yml.j2
    env:
      TRAEFIK_DASHBOARD_AUTH: "{{ SECRET_TRAEFIK_DASHBOARD_AUTH }}"
      IONOS_API_KEY: "{{ SECRET_IONOS_API_KEY }}"
    config_files:
      - src: traefik/config/traefik.yml.j2
        dest: config/traefik.yml
      # Statische Route für Home Assistant, das wegen mDNS/SSDP im
      # host-Netzwerk läuft und daher nicht per Docker-Provider gefunden wird.
      - src: traefik/config/dynamic/homeassistant.yml.j2
        dest: config/dynamic/homeassistant.yml

  # --- Dockhand: Docker- und Compose-Management ---
  - name: dockhand
    compose_template: dockhand/docker-compose.yml.j2

