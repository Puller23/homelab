---
SECRET_CODE_SERVER_PASSWORD: "{{ lookup('ansible.builtin.env', 'SECRET_CODE_SERVER_PASSWORD', default=undef()) }}"
SECRET_DOMAIN: "{{ lookup('ansible.builtin.env', 'SECRET_DOMAIN', default=undef()) }}"
SECRET_IONOS_EMAIL: "{{ lookup('ansible.builtin.env', 'SECRET_IONOS_EMAIL', default=undef()) }}"
SECRET_IONOS_API_KEY: "{{ lookup('ansible.builtin.env', 'SECRET_IONOS_API_KEY', default=undef()) }}"
SECRET_TRAEFIK_DASHBOARD_AUTH: "{{ lookup('ansible.builtin.env', 'SECRET_TRAEFIK_DASHBOARD_AUTH', default=undef()) }}"
SECRET_POSTGRES_HOMEASSISTANT_PASSWORD: "{{ lookup('ansible.builtin.env', 'SECRET_POSTGRES_HOMEASSISTANT_PASSWORD', default=undef()) }}"
SECRET_POSTGRES_PAPERLESS_PASSWORD: "{{ lookup('ansible.builtin.env', 'SECRET_POSTGRES_PAPERLESS_PASSWORD', default=undef()) }}"

# Optionale Homepage-API-Zugangsdaten aus der Semaphore-Umgebung.
SECRET_HOMEPAGE_PROXMOX_PVE01_TOKEN_SECRET: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_PROXMOX_PVE01_TOKEN_SECRET') | default('', true) }}"
SECRET_HOMEPAGE_PROXMOX_PVE02_TOKEN_SECRET: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_PROXMOX_PVE02_TOKEN_SECRET') | default('', true) }}"
SECRET_HOMEPAGE_PROXMOX_PVE01_TOKEN_ID: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_PROXMOX_PVE01_TOKEN_ID') | default('homepage@pve!homepage', true) }}"
SECRET_HOMEPAGE_PROXMOX_PVE02_TOKEN_ID: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_PROXMOX_PVE02_TOKEN_ID') | default('homepage@pve!homepage', true) }}"
SECRET_HOMEPAGE_HOMEASSISTANT_TOKEN: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_HOMEASSISTANT_TOKEN') | default('', true) }}"
SECRET_HOMEPAGE_PAPERLESS_TOKEN: "{{ lookup('ansible.builtin.env', 'SECRET_HOMEPAGE_PAPERLESS_TOKEN') | default('', true) }}"
